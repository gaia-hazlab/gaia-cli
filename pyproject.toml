[project]
authors = [{name = "Scott Henderson", email = "3924836+scottyhq@users.noreply.github.com"}]
name = "gaia-cli"
requires-python = ">= 3.11"
version = "0.1.0"
dependencies = [
  "cyclopts>=5.2.0,<6",
  "geopandas>=1.2.0,<2",
  "pyyaml>=6",
  "requests",
  "xarray",
  "xvec>=0.5.2,<0.6",
  "zarr"
, "pytest>=9.1.1,<10", "ty>=0.0.87,<0.0.88", "ruff>=0.17.0,<0.18"]

[project.optional-dependencies]
dev = [
  "pytest",
  "ty",
  "ruff"
]

[project.scripts]
gaia = "gaia_cli.cli:main"

[tool.pytest.ini_options]
# Network tests are opt-in: `pixi run test-online` (pytest -m online)
addopts = "-m 'not online'"
markers = ["online: needs network access to the upstream data services"]
filterwarnings = [
  # upstream: rioxarray and odc-geo still use affine's deprecated `*` operator
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning:(rioxarray|odc\\.geo)",
  # upstream: odc-geo still calls the deprecated shapely.ops.transform
  "ignore:The 'shapely.ops.transform\\(\\)' function is deprecated:DeprecationWarning:odc\\.geo",
  # io.py consolidates every store on purpose and silences this at runtime,
  # but pytest resets warning filters per test
  "ignore:Consolidated metadata is currently not part:zarr.errors.ZarrUserWarning",
]

[tool.coverage.run]
source = ["gaia_cli"]
omit = ["*/gaia_cli/__main__.py"]

[tool.coverage.report]
fail_under = 80
skip_covered = true

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
# # linux arm = "linux-aarch64"
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
gaia_cli = { path = ".", editable = true }

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
test = { cmd = "pytest", description = "Run the test suite" }
test-online = { cmd = "pytest -m online", description = "Run the network smoke tests (SYNOPTIC_TOKEN enables synoptic)" }
coverage = { cmd = "pytest --cov --cov-report=term-missing", description = "Run the tests and report line coverage of src/gaia_cli; fails below 80%" }
typecheck = { cmd = "ty check src/", description = "Type-check src/ with ty" }
lint = { cmd = "ruff check src tests --fix ; ruff format src tests", description = "Fix lint issues and format src/ and tests/" }
lint-check = { cmd = "ruff check src tests && ruff format --check src tests", description = "Check lint and formatting without changing files (CI)" }

[tool.pixi.feature.dev.dependencies]
pytest-cov = ">=7.1.0,<8"

[tool.pixi.dependencies]
ipykernel = ">=7.4.0,<8"
rioxarray = ">=0.23.0,<0.24"
obstore = ">=0.11.1,<0.12"
boto3 = ">=1.43.111,<2"
matplotlib-base = ">=3.11.2,<4"
folium = ">=0.20.0,<0.21"
matplotlib = ">=3.11.2,<4"
mapclassify = ">=2.11.0,<3"
xyzservices = ">=2026.9.1,<2027"
odc-stac = ">=0.5.3,<0.6"
rustac = ">=0.9.17,<0.10"
pystac-client = ">=0.9.0,<0.10"
python-dotenv = ">=1.2.4,<2"
icechunk = ">=2.3.0,<3"
exactextract = ">=0.3.0,<0.4"
