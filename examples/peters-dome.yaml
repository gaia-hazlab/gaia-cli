# Peters Dome, AK: the 2023-09-14 ice-rock avalanche (Toney et al., 2026,
# https://doi.org/10.1029/2025JF008577). For now only
# Sentinel-1 RTC (step 2.4a); the full reference stage file is step 3.2. Check, then stage:
#   gaia stage --config examples/peters-dome.yaml --dry-run
#   gaia stage --config examples/peters-dome.yaml -o peters-dome
# peters-dome.ipynb compares the passes before and after the event.
name: peters-dome
time: 2023-09-14T02:06:49Z          # ComCat origin
attrs:
  title: Peters Dome ice-rock avalanche, Sentinel-1 RTC
aois:
  source: {latitude: 63.1455, longitude: -151.1904, radius_km: 15}   # around the ComCat location
  regional: {bbox: [-152.2, 62.75, -150.2, 63.55]}
aoi: source                          # relative orbit 131 only; regional also has 102
window: {before: 36d, after: 36d}    # three 12-day repeats on each side
datasets:
  sentinel1-rtc: {}
