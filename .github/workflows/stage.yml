name: Stage Dataset
run-name: ${{ inputs.workflow_name }}-${{ inputs.subcommand }}-${{ inputs.start_date }}_${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      subcommand:
        description: "Stage subcommand to run"
        required: true
        type: choice
        options:
          - all
          - synoptic
          - prism
          - hrrr
      aoi:
        description: "URL to AOI vector file (--input)"
        required: true
        type: string
        default: "https://raw.githubusercontent.com/DSHydro/skagit-met/refs/heads/main/data/GIS/SkagitBoundary.json"
      start_date:
        description: "Start date, e.g. 2025-12-01 (--start)"
        required: true
        type: string
      end_date:
        description: "End date, e.g. 2025-12-20 (--end)"
        required: true
        type: string
      workflow_name:
        description: "Short name to identify workflow and output Zarr (e.g 'Skagit')"
        required: true
        type: string
      copy_to_s3:
        description: "Whether to copy to S3 Scratch bucket"
        default: false
        type: boolean
      overwrite:
        description: "Overwrite existing Zarr store in S3 (only applies if copying to S3)"
        default: false
        type: boolean

jobs:
  stage:
    runs-on: ubuntu-latest
    env:
      S3_DEST: s3://gaia/scratch/github-workflows/${{ inputs.workflow_name }}-${{ inputs.subcommand }}-${{ inputs.start_date }}_${{ inputs.end_date }}.zarr
    steps:
      - uses: actions/checkout@v7

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Configure AWS Credentials
        if: ${{ inputs.copy_to_s3 == true }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: us-west-2

      - name: Check S3 destination
        if: ${{ inputs.copy_to_s3 == true && inputs.overwrite == false }}
        run: |
          if aws s3 ls "${S3_DEST}/" > /dev/null 2>&1; then
            echo "::error::${S3_DEST} already exists. Re-run with 'overwrite' checked to replace it."
            exit 1
          fi

      - name: Run gaia stage ${{ inputs.subcommand }}
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: |
          pixi run gaia stage ${{ inputs.subcommand }} \
            -i "${{ inputs.aoi }}" \
            -s "${{ inputs.start_date }}" \
            -e "${{ inputs.end_date }}" \
            -o output.zarr

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.workflow_name }}-${{ inputs.subcommand }}-${{ inputs.start_date }}_${{ inputs.end_date }}
          path: output.zarr

      - name: Upload to AWS S3
        if: ${{ inputs.copy_to_s3 == true }}
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if [ "${OVERWRITE}" = "true" ]; then
            aws s3 sync --delete output.zarr "${S3_DEST}"
          else
            aws s3 sync output.zarr "${S3_DEST}"
          fi

