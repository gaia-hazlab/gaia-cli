name: Stage Dataset
run-name: ${{ inputs.workflow_name }}-${{ inputs.subcommand }}-${{ inputs.start_date }}_${{ inputs.end_date }}

on:
  workflow_dispatch:
    inputs:
      subcommand:
        description: "Dataset to stage, or the conus-precip preset (synoptic, prism and hrrr)"
        required: true
        type: choice
        options:
          - conus-precip
          - synoptic
          - prism
          - hrrr
      aoi:
        description: "URL to AOI vector file (--input)"
        required: true
        type: string
        default: "https://raw.githubusercontent.com/DSHydro/skagit-met/refs/heads/main/data/GIS/SkagitBoundary.json"
      start_date:
        description: "Start date, e.g. 2025-12-01 (--start)"
        required: true
        type: string
      end_date:
        description: "End date, e.g. 2025-12-20 (--end)"
        required: true
        type: string
      workflow_name:
        description: "Short name to identify workflow and output folder (e.g 'Skagit')"
        required: true
        type: string
      copy_to_s3:
        description: "Whether to copy to S3 Scratch bucket"
        default: false
        type: boolean
      overwrite:
        description: "Overwrite the existing output folder in S3 (only applies if copying to S3)"
        default: false
        type: boolean
      storage:
        description: "S3-compatible object store (GitHub Environment holding its credentials)"
        default: kopah
        type: choice
        options:
          - kopah
          - backblaze

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: ${{ inputs.storage }}
    env:
      # S3-compatible (non-AWS) store: aws-cli reads these directly, no STS involved
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-west-2' }}
      # Recent aws-cli sends CRC checksums by default, which some S3-compatible stores reject
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Output folder (gaia stage -o): <NAME>/<NAME>.zarr, its STAC Item and stage.yaml
      NAME: ${{ inputs.workflow_name }}-${{ inputs.subcommand }}-${{ inputs.start_date }}_${{ inputs.end_date }}
      S3_DEST: s3://${{ vars.S3_BUCKET || 'gaia' }}/scratch/github-workflows/${{ inputs.workflow_name }}-${{ inputs.subcommand }}-${{ inputs.start_date }}_${{ inputs.end_date }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, for the package version (hatch-vcs)
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Check S3 destination
        if: ${{ inputs.copy_to_s3 == true && inputs.overwrite == false }}
        run: |
          if aws s3 ls "${S3_DEST}/" > /dev/null 2>&1; then
            echo "::error::${S3_DEST} already exists. Re-run with 'overwrite' checked to replace it."
            exit 1
          fi

      - name: Run gaia stage ${{ inputs.subcommand }}
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
          SUBCOMMAND: ${{ inputs.subcommand }}
        run: |
          if [ "${SUBCOMMAND}" = "conus-precip" ]; then
            target=(--config conus-precip)
          else
            target=("${SUBCOMMAND}")
          fi
          pixi run gaia stage "${target[@]}" \
            -i "${{ inputs.aoi }}" \
            -s "${{ inputs.start_date }}" \
            -e "${{ inputs.end_date }}" \
            -o "${NAME}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.workflow_name }}-${{ inputs.subcommand }}-${{ inputs.start_date }}_${{ inputs.end_date }}
          path: ${{ env.NAME }}

      - name: Upload to AWS S3
        if: ${{ inputs.copy_to_s3 == true }}
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          if [ "${OVERWRITE}" = "true" ]; then
            aws s3 sync --delete "${NAME}" "${S3_DEST}"
          else
            aws s3 sync "${NAME}" "${S3_DEST}"
          fi

