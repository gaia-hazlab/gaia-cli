name: Release

# Pushing a version tag (e.g. `git tag v0.2 && git push origin v0.2`) runs the
# tests and publishes a GitHub Release with generated notes. The package
# version itself comes from the tag (hatch-vcs); see dev/releasing.md.
on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, for the package version (hatch-vcs)
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Check the package version matches the tag
        # pixi doesn't rebuild the editable install when only the tag changes,
        # and the cached environment may predate it
        run: |
          pixi reinstall gaia-cli
          version=$(pixi run python -c "import importlib.metadata as m; print(m.version('gaia-cli'))")
          echo "gaia-cli ${version}"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::package version ${version} does not match tag ${GITHUB_REF_NAME}"
            exit 1
          fi

      - name: Run tests
        run: pixi run test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --verify-tag --generate-notes
