name: Stage Event
run-name: ${{ inputs.name }}

# Stages every dataset in a stage file (an event's AOI, window and datasets), then
# optionally aligns the store onto one grid and writes Landlab inputs from it.
on:
  workflow_dispatch:
    inputs:
      config:
        description: "Stage file: a path in this repository (e.g. examples/pioneer.yaml) or an http(s) URL"
        required: true
        type: string
      name:
        description: "Output folder name (e.g. 'pioneer'); the aligned store goes to <name>-aligned"
        required: true
        type: string
      align:
        description: "gaia align options, e.g. '--crs utm --res 10 --aoi examples/pioneer-aoi.geojson'. Empty: don't align"
        required: false
        type: string
        default: ""
      landlab_inputs:
        description: "Write Landlab GeoTIFF and ASCII inputs from the aligned store (scripts/landlab-inputs.sh)"
        default: false
        type: boolean
      copy_to_s3:
        description: "Whether to copy the stores to the S3 scratch bucket"
        default: false
        type: boolean
      overwrite:
        description: "Overwrite existing output folders in S3 (only applies if copying to S3)"
        default: false
        type: boolean
      storage:
        description: "S3-compatible object store (GitHub Environment holding its credentials)"
        default: kopah
        type: choice
        options:
          - kopah
          - backblaze
          - huggingface

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: ${{ inputs.storage }}
    env:
      # S3-compatible (non-AWS) store: aws-cli reads these directly, no STS involved
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: ${{ vars.AWS_ENDPOINT_URL }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION || 'us-west-2' }}
      # Recent aws-cli sends CRC checksums by default, which some S3-compatible stores reject
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      # Inputs reach the scripts as variables, never pasted into them
      CONFIG: ${{ inputs.config }}
      NAME: ${{ inputs.name }}
      ALIGNED: ${{ inputs.name }}-aligned
      LANDLAB: ${{ inputs.name }}-landlab
      ALIGN_OPTIONS: ${{ inputs.align }}
      S3_PREFIX: s3://${{ vars.S3_BUCKET || 'gaia' }}/scratch/github-workflows
    steps:
      - name: Check inputs
        if: ${{ inputs.landlab_inputs && inputs.align == '' }}
        run: |
          echo "::error::landlab_inputs needs an aligned store: give align options, e.g. --crs utm --res 10 --aoi <AOI>"
          exit 1

      - uses: actions/checkout@v7
        with:
          # Tags, for the package version (hatch-vcs)
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          cache: true

      - name: Check S3 destinations
        if: ${{ inputs.copy_to_s3 && !inputs.overwrite }}
        run: |
          folders=("${NAME}")
          if [ -n "${ALIGN_OPTIONS}" ]; then folders+=("${ALIGNED}"); fi
          for folder in "${folders[@]}"; do
            if aws s3 ls "${S3_PREFIX}/${folder}/" > /dev/null 2>&1; then
              echo "::error::${S3_PREFIX}/${folder} already exists. Re-run with 'overwrite' checked to replace it."
              exit 1
            fi
          done

      - name: Run gaia stage
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
        run: pixi run gaia stage --config "${CONFIG}" -o "${NAME}"

      - name: Run gaia align
        if: ${{ inputs.align != '' }}
        run: |
          # The store is named after the stage file's `name`, not the folder
          stores=("${NAME}"/*.zarr)
          read -ra options <<< "${ALIGN_OPTIONS}"
          pixi run gaia align -i "${stores[0]}" -o "${ALIGNED}" "${options[@]}"

      - name: Write Landlab inputs
        if: ${{ inputs.landlab_inputs }}
        run: pixi run scripts/landlab-inputs.sh "${ALIGNED}/${ALIGNED}.zarr" "${LANDLAB}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.name }}
          path: ${{ env.NAME }}
          compression-level: 0  # Zarr chunks are already compressed
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.align != '' }}
        with:
          name: ${{ inputs.name }}-aligned
          path: ${{ env.ALIGNED }}
          compression-level: 0
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ inputs.landlab_inputs }}
        with:
          name: ${{ inputs.name }}-landlab
          path: ${{ env.LANDLAB }}
          retention-days: 7

      - name: Upload to S3
        if: ${{ inputs.copy_to_s3 }}
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          folders=("${NAME}")
          if [ -d "${ALIGNED}" ]; then folders+=("${ALIGNED}"); fi
          for folder in "${folders[@]}"; do
            if [ "${OVERWRITE}" = "true" ]; then
              aws s3 sync --delete "${folder}" "${S3_PREFIX}/${folder}"
            else
              aws s3 sync "${folder}" "${S3_PREFIX}/${folder}"
            fi
          done
