name: Docs

# Builds the user docs (docs/) with MyST. Pull requests only build them;
# pushes to main also deploy them to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Served from https://gaia-hazlab.github.io/gaia-cli/
      BASE_URL: /${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, for the package version (hatch-vcs)
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.2
        with:
          environments: docs
          cache: true

      - name: Build docs
        run: pixi run docs-build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
