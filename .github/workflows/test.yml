name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, for the package version (hatch-vcs)
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true

      - name: Run tests with coverage
        run: pixi run coverage

      - name: Run typecheck
        run: pixi run typecheck

      - name: Run lint
        run: pixi run lint-check

      - name: Check the example notebooks have no outputs
        # The docs build runs them; clear outputs with `pixi run strip-notebooks`
        run: pixi run -e dev nbstripout --verify examples/*.ipynb

  online:
    # Network smoke tests against the upstream data services
    runs-on: ubuntu-latest
    # A backstop: a stalled upstream shouldn't hold the job for GitHub's 6 hours
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags, for the package version (hatch-vcs)
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.11.3
        with:
          cache: true

      - name: Run online tests
        env:
          SYNOPTIC_TOKEN: ${{ secrets.SYNOPTIC_TOKEN }}
          ARRAYLAKE_TOKEN: ${{ secrets.ARRAYLAKE_TOKEN }}
          # Earthdata Login user tokens expire after 60 days
          EARTHDATA_TOKEN: ${{ secrets.EARTHDATA_TOKEN }}
        run: pixi run test-online
